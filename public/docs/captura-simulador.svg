  <text x="54" y="206" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Envío a 40 clientes (45 MB) y CCO</text>
  <text x="54" y="226" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#334155">Usuaria: Carmen Vázquez (Finanzas)</text>
  <text x="54" y="246" font-family="IBM Plex Mono, monospace" font-size="11" fill="#DC2626">▲ Frustración inicial: 85%</text>

