  <rect x="364" y="88" width="812" height="560" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="388" y="122" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#0F172A">INC-1042 · Carmen Vázquez (Directora Financiera)</text>
  <text x="388" y="142" font-family="IBM Plex Mono, monospace" font-size="12" fill="#D97706">Estado Emocional: Alterada (Frustración: 55% ↓) · Fase 2 de 3</text>

