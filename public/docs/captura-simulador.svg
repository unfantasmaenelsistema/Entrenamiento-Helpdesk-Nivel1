  <text x="72" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Un Fantasma en el Sistema · Helpdesk Nivel 1</text>
  <text x="520" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#0284C7">Simulador de Tickets</text>
  <text x="680" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#475569">Manual de Ofimática</text>
  <text x="840" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="500" fill="#475569">Evaluación y Rúbrica</text>
  <rect x="1020" y="16" width="150" height="32" rx="6" fill="#0F172A"/>
  <text x="1044" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">unfantasmaenelsistema</text>

