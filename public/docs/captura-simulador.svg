  <rect x="40" y="270" width="288" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="292" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#475569">INC-1048 · Procesador de Textos</text>
  <text x="54" y="314" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Pérdida de contrato de 35 páginas</text>
  <text x="54" y="334" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748B">Usuario: Roberto Méndez (Compras)</text>

  <!-- Third Ticket Card -->
  <rect x="40" y="372" width="288" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="394" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#475569">INC-1053 · Presentaciones</text>
  <text x="54" y="416" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Proyector sin imagen y Vista Moderador</text>
  <text x="54" y="436" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748B">Usuaria: Elena Soriano (Ventas)</text>

