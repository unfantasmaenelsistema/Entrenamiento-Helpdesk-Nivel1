  <rect x="404" y="194" width="732" height="70" rx="6" fill="#1E293B"/>
  <text x="420" y="218" font-family="IBM Plex Mono, monospace" font-size="12" fill="#F8FAFC">Para: carmen.vazquez@empresa.es  |  CCO: [40 clientes ocultos RGPD OK]</text>
  <text x="420" y="244" font-family="IBM Plex Mono, monospace" font-size="12" fill="#34D399">Adjunto Nube: Dossier_Auditoria_2026.pdf (45,2 MB) · Permiso: Solo lectura</text>

  <!-- Chat Transcript Box -->
  <rect x="388" y="292" width="764" height="210" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
