  <rect x="406" y="308" width="560" height="68" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="422" y="328" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Carmen Vázquez (Usuaria Frustrada):</text>
  <text x="422" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#7F1D1D">«¡¡Vuestro correo no funciona!! Intento mandar el PDF de 45 MB a 40 clientes y</text>
  <text x="422" y="364" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#7F1D1D">me sale una ventana roja de límite superado. ¡Me quedan 10 minutos!»</text>

  <!-- Student Bubble -->
  <rect x="540" y="390" width="594" height="94" rx="8" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="556" y="410" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#075985">Alumno Técnico Helpdesk N1 (Empatía: 96% · Precisión: 98%):</text>
  <text x="556" y="430" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#0C4A6E">«Buenos días, Carmen. Entiendo la urgencia con la auditoría, tranquila que</text>
  <text x="556" y="448" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#0C4A6E">sale a tiempo. El correo limita adjuntos directos a 25 MB. Subámoslo a OneDrive</text>
  <text x="556" y="466" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#0C4A6E">en modo Solo lectura y pongamos a los 40 clientes en CCO para proteger sus datos.»</text>

  <!-- Response Composer -->
  <rect x="388" y="518" width="590" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="406" y="544" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748B">Escribe tu respuesta empática y guía paso a paso al usuario...</text>
  <rect x="994" y="518" width="158" height="108" rx="8" fill="#0284C7"/>
  <text x="1024" y="576" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Enviar Respuesta</text>
